<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Express Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: Autodesk-style shell — title bar, ribbon tabs, ribbon, [library | viewport | outliner+properties], timeline, status bar */
:root{
  --bg0:#15171b; --bg1:#1c1f24; --bg2:#23272d; --bg3:#2b3038; --bg4:#343a44;
  --bd:#3a414b; --bd2:#4a525e; --tx:#d9dee5; --tx2:#98a2ae; --tx3:#6c7682;
  --ac:#0696d7; --ac2:#3db8f0; --acbg:rgba(6,150,215,.22);
  --key:#f2b134; --ok:#4fbf83; --bad:#e5534b; --sk:#4fd1ff;
  --ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:13px/1.4 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-rows:38px 30px 90px minmax(0,1fr) var(--tlh,176px) 24px;height:100%;opacity:0}
#app.no-tl{--tlh:0px} #app.no-tl #timeline{display:none}
/* title bar */
#titlebar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg0);border-bottom:1px solid var(--bd);min-width:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.06em;font-size:13px;white-space:nowrap;margin-inline-end:10px}
.logo b{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:linear-gradient(135deg,var(--ac),#0b5f8c);color:#fff;font-size:11px;letter-spacing:0}
.logo span{color:var(--tx2);font-weight:500;letter-spacing:.02em}
.tb{display:flex;align-items:center;gap:5px;height:28px;padding:0 9px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;color:var(--tx);white-space:nowrap}
.tb:hover{background:var(--bg3);border-color:var(--bd)}
.tb svg.i{width:16px;height:16px}
.tsep{width:1px;height:18px;background:var(--bd);margin:0 4px}
.tspacer{flex:1}
.docname{color:var(--tx2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbScroll{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
/* ribbon */
#tabs{display:flex;gap:2px;padding:0 8px;background:var(--bg1);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tab{padding:0 14px;height:29px;border:none;background:none;color:var(--tx2);cursor:pointer;border-top:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--bg3);color:var(--tx);border-top-color:var(--ac)}
#ribbon{display:flex;background:var(--bg3);border-bottom:1px solid var(--bd);overflow-x:auto;overflow-y:hidden;padding:4px 4px 0}
.rg{display:flex;flex-direction:column;border-inline-end:1px solid var(--bd);padding:0 6px;flex:none}
.rg-items{display:flex;gap:1px;flex:1;align-items:flex-start}
.rg-name{font-size:10.5px;color:var(--tx3);text-align:center;padding:1px 0 3px;white-space:nowrap}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;width:58px;min-height:62px;padding:6px 2px 3px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;color:var(--tx)}
.rb span{font-size:11px;line-height:1.15;text-align:center;color:var(--tx)}
.rb svg.i{width:24px;height:24px;stroke-width:1.5}
.rb:hover{background:var(--bg4);border-color:var(--bd2)}
.rb.on{background:var(--acbg);border-color:var(--ac)}
.rb.on svg.i{color:var(--ac2)}
.rb .sw{width:24px;height:24px;border-radius:50%;box-shadow:inset -3px -4px 8px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
.rfield{display:flex;flex-direction:column;gap:2px;padding:2px 4px 0;font-size:11px;color:var(--tx2)}
.rfield label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rfield input,.rfield select{width:84px;height:20px;background:var(--bg1);border:1px solid var(--bd);border-radius:3px;padding:0 4px;direction:ltr}
.rfield input[type=color]{padding:0 2px;width:40px}
/* main */
main{display:grid;grid-template-columns:var(--lw,236px) minmax(0,1fr) var(--sw,292px);min-height:0}
#app.no-lib{--lw:0px} #app.no-lib #library{display:none}
#app.no-side{--sw:0px} #app.no-side #sidebar{display:none}
.panel{background:var(--bg2);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 10px;background:var(--bg1);border-bottom:1px solid var(--bd);font-weight:600;font-size:12px;letter-spacing:.02em;flex:none}
.ph small{color:var(--tx3);font-weight:400}
#library{border-inline-end:1px solid var(--bd)}
#libTabs{display:flex;gap:2px;padding:6px 6px 0;background:var(--bg2);flex-wrap:wrap}
.lt{flex:1 1 auto;min-width:0;padding:5px 5px;white-space:nowrap;border:1px solid var(--bd);border-bottom:none;border-radius:4px 4px 0 0;background:var(--bg1);color:var(--tx2);cursor:pointer;font-size:11.5px}
.lt.on{background:var(--bg3);color:var(--tx);border-color:var(--bd2)}
.lsearch{margin:0 6px;padding:6px;background:var(--bg3);border:1px solid var(--bd2);border-top:none}
.lsearch input{width:100%;height:26px;background:var(--bg1);border:1px solid var(--bd);border-radius:3px;padding:0 8px}
#libGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding:8px 6px;align-content:start;margin:0 6px 6px;background:var(--bg3);border:1px solid var(--bd2);border-top:none}
.li{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px 5px;border:1px solid transparent;border-radius:5px;cursor:grab;background:var(--bg2)}
.li:hover{border-color:var(--ac);background:var(--bg4)}
.li img,.li .lic{width:100%;aspect-ratio:1;max-width:72px;border-radius:4px;object-fit:cover;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3b424d,#22262c)}
.li .lic svg.i{width:30px;height:30px;color:var(--ac2)}
.li span{font-size:11px;text-align:center;color:var(--tx);line-height:1.15}
.libhint{grid-column:1/-1;color:var(--tx3);font-size:11px;padding:2px 2px 4px}
/* viewport */
#vpWrap{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 30%,#3c4450 0%,#262b33 55%,#191c21 100%);overflow:hidden}
#vpWrap.flat{background:var(--vpbg,#2a2f37)}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;outline:none;touch-action:none}
.hud{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:6px;pointer-events:none;direction:ltr}
.hud span{background:rgba(20,22,26,.72);border:1px solid var(--bd);padding:2px 8px;border-radius:3px;font-size:11px;color:var(--tx2)}
.hud span.live{color:var(--key);border-color:var(--key)}
#vcBtns{position:absolute;top:126px;right:16px;display:flex;gap:3px;direction:ltr}
#vcBtns button{width:24px;height:22px;border:1px solid var(--bd);border-radius:3px;background:rgba(28,31,36,.85);color:var(--tx2);cursor:pointer;font-size:10px;display:grid;place-items:center;padding:0}
#vcBtns button:hover{color:var(--tx);border-color:var(--ac)}
#vcBtns svg.i{width:14px;height:14px}
#skHint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(10,30,40,.85);border:1px solid var(--sk);color:var(--sk);padding:6px 14px;border-radius:20px;font-size:12px;display:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#dropFx{position:absolute;inset:6px;border:2px dashed var(--ac);border-radius:6px;pointer-events:none;display:none;background:rgba(6,150,215,.06)}
/* sidebar */
#sidebar{border-inline-start:1px solid var(--bd)}
#outliner{height:38%;min-height:120px;display:flex;flex-direction:column;border-bottom:1px solid var(--bd)}
#olSearch{margin:6px;height:24px;background:var(--bg1);border:1px solid var(--bd);border-radius:3px;padding:0 8px}
#olList{flex:1;overflow:auto;padding:0 4px 6px}
.ol{display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;border-radius:3px;cursor:pointer;color:var(--tx)}
.ol:hover{background:var(--bg3)}
.ol.on{background:var(--acbg);outline:1px solid var(--ac)}
.ol svg.i{width:15px;height:15px;color:var(--tx2)}
.ol .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol .kf{color:var(--key);font-size:10px}
.ol .eye{border:none;background:none;cursor:pointer;color:var(--tx3);padding:2px;display:grid}
.ol .eye:hover{color:var(--tx)}
.ol.hid .nm{color:var(--tx3);text-decoration:line-through}
.ol input{flex:1;height:20px;background:var(--bg0);border:1px solid var(--ac);color:var(--tx);padding:0 4px}
#props{flex:1;overflow:auto;padding-bottom:16px}
.sec{border-bottom:1px solid var(--bd)}
.sec h4{margin:0;padding:7px 10px;font-size:11.5px;font-weight:600;color:var(--tx2);background:var(--bg1);letter-spacing:.03em;cursor:pointer;display:flex;justify-content:space-between}
.sec h4::after{content:'▾';color:var(--tx3)}
.sec.closed h4::after{content:'◂'}
.sec.closed .sb{display:none}
.sb{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 38px;align-items:center;gap:6px}
.row>label{color:var(--tx2);font-size:12px}
.row input[type=text],.row select,.row input[type=number]{grid-column:2/4;height:24px;background:var(--bg1);border:1px solid var(--bd);border-radius:3px;padding:0 6px;min-width:0}
.row input[type=range]{width:100%;accent-color:var(--ac)}
.row output{font-size:11px;color:var(--tx2);text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.row input[type=color]{grid-column:2/4;height:24px;width:100%;border:1px solid var(--bd);border-radius:3px;background:var(--bg1);padding:1px 2px}
.vec{display:grid;grid-template-columns:62px repeat(3,14px minmax(0,1fr));align-items:center;gap:3px;direction:ltr}
.vec .vl{direction:rtl;color:var(--tx2);font-size:12px;text-align:right;grid-column:1;order:-1}
.vec input{height:24px;background:var(--bg1);border:1px solid var(--bd);border-radius:3px;padding:0 3px;min-width:0;width:100%;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.scrub{cursor:ew-resize;font-size:10px;font-weight:700;text-align:center;border-radius:2px;padding:4px 0}
.ax0{color:#ff6b6b}.ax1{color:#7ed957}.ax2{color:#5aa9ff}
.chk{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.chk label{display:flex;align-items:center;gap:5px;cursor:pointer}
.chk input{accent-color:var(--ac)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:26px;padding:0 10px;border:1px solid var(--bd2);border-radius:3px;background:var(--bg3);cursor:pointer;color:var(--tx)}
.btn:hover{border-color:var(--ac);background:var(--bg4)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--bg4);color:var(--tx2);font-size:11px;grid-column:2/4;justify-self:start}
.hint{margin:0;color:var(--tx3);font-size:11.5px}
.empty{padding:22px 16px;text-align:center;color:var(--tx3)}
.empty svg.i{width:34px;height:34px;color:var(--bd2)}
.empty p{margin:6px 0 2px;color:var(--tx2)}
.kbd{font-family:var(--mono);font-size:10.5px;background:var(--bg0);border:1px solid var(--bd);border-radius:3px;padding:0 4px;color:var(--tx2)}
/* timeline */
#timeline{background:var(--bg2);border-top:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.tlbar{display:flex;align-items:center;gap:4px;padding:3px 8px;background:var(--bg1);border-bottom:1px solid var(--bd);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;flex:none}
.tlbar .tb{height:24px;padding:0 6px}
.tlbar .tb svg.i{width:15px;height:15px}
.tlbar label{display:flex;align-items:center;gap:4px;color:var(--tx2);font-size:11.5px;white-space:nowrap;margin-inline-start:6px}
.tlbar input[type=number],.tlbar select{height:22px;background:var(--bg0);border:1px solid var(--bd);border-radius:3px;padding:0 4px}
.tlbar input[type=number]{width:52px;direction:ltr}
#tlTime{font-family:var(--mono);font-size:12px;color:var(--key);background:var(--bg0);border:1px solid var(--bd);border-radius:3px;padding:1px 8px;direction:ltr;min-width:110px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
#tlPlay.on{background:var(--acbg);border-color:var(--ac)}
#tlAuto.on{background:var(--bad);border-color:var(--bad);color:#fff}
#timeline.auto #tlArea{box-shadow:inset 0 0 0 2px var(--bad)}
#timeline.auto ~ #status{border-top-color:var(--bad)}
.tlbody{flex:1;overflow:auto;display:grid;grid-template-columns:160px minmax(0,1fr);direction:ltr;min-height:0}
.tln{border-right:1px solid var(--bd);background:var(--bg2)}
.tln .rh,.tlr{height:22px;position:sticky;top:0;z-index:2;background:var(--bg1);border-bottom:1px solid var(--bd)}
.tln .rh{display:flex;align-items:center;padding:0 8px;color:var(--tx3);font-size:11px}
.tlnm{height:22px;display:flex;align-items:center;gap:5px;padding:0 8px;font-size:11.5px;cursor:pointer;direction:rtl;justify-content:flex-end;white-space:nowrap;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.03)}
.tlnm.on{background:var(--acbg);color:#fff}
#tlArea{position:relative;min-width:0;cursor:pointer}
.tlr{position:sticky}
.tick{position:absolute;bottom:0;width:1px;background:var(--bd2);height:5px}
.tick.maj{height:10px;background:var(--tx3)}
.tick i{position:absolute;bottom:9px;left:3px;font-style:normal;font-size:10px;color:var(--tx3);font-family:var(--mono)}
.tltr{height:22px;position:relative;border-bottom:1px solid rgba(255,255,255,.03)}
.tltr.on{background:rgba(6,150,215,.08)}
.tltr .bar{position:absolute;top:9px;height:4px;background:rgba(242,177,52,.25);border-radius:2px}
.kd{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;background:var(--key);transform:rotate(45deg);border:1px solid #6b4a0c;cursor:ew-resize;border-radius:2px;z-index:1}
.kd:hover,.kd.sel{background:#fff6dd;box-shadow:0 0 0 2px var(--key)}
#ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bad);z-index:3;pointer-events:none}
#ph::before{content:'';position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--bad)}
/* status */
#status{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--bg0);border-top:1px solid var(--bd);font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden}
#status b{color:var(--tx2);font-weight:500}
#stHint{flex:1;overflow:hidden;text-overflow:ellipsis}
#stStats{direction:ltr;font-family:var(--mono);font-size:11px}
/* overlays */
#ctx,#menu{position:fixed;z-index:50;min-width:190px;background:var(--bg2);border:1px solid var(--bd2);border-radius:5px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:4px;display:none}
.mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border:none;background:none;cursor:pointer;border-radius:3px;text-align:start;color:var(--tx)}
.mi:hover{background:var(--ac);color:#fff}
.mi svg.i{width:15px;height:15px}
.mi kbd{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.msep{height:1px;background:var(--bd);margin:4px 2px}
#modalBg{position:fixed;inset:0;z-index:60;background:rgba(5,7,10,.55);display:none;place-items:center;padding:16px}
#modal{width:min(420px,100%);background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
#modal h3{margin:0;padding:10px 14px;background:var(--bg1);border-bottom:1px solid var(--bd);font-size:13px}
#modal .mb{padding:14px;display:flex;flex-direction:column;gap:9px;max-height:70vh;overflow:auto}
#modal .mf{display:flex;justify-content:flex-start;gap:8px;padding:10px 14px;border-top:1px solid var(--bd);background:var(--bg1)}
#modal table{width:100%;border-collapse:collapse;font-size:12px}
#modal td{padding:4px 6px;border-bottom:1px solid var(--bd)}
#toasts{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--bd2);border-inline-start:3px solid var(--ac);padding:7px 14px;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:12.5px;white-space:nowrap}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 45%,#1d2a36,#0d1014 70%);display:grid;place-items:center}
.sp{display:flex;flex-direction:column;align-items:center;gap:14px;direction:ltr}
.sp-cube{width:64px;height:64px;perspective:300px}
.sp-cube div{width:64px;height:64px;border:2px solid var(--ac2);border-radius:8px;background:rgba(6,150,215,.15);box-shadow:0 0 40px rgba(6,150,215,.35)}
.sp-title{font-size:30px;font-weight:700;letter-spacing:.18em;color:#fff;display:flex}
.sp-title span{display:inline-block}
.sp-title em{font-style:normal;color:var(--ac2)}
.sp-sub{color:var(--tx2);font-size:13px}
.sp-bar{width:220px;height:3px;background:#273039;border-radius:2px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
input[type=file]{display:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
@media (max-width:900px){
  #app{grid-template-rows:38px 30px 90px minmax(0,1fr) var(--tlh,150px) 24px}
  main{grid-template-columns:minmax(0,1fr)}
  #library,#sidebar{position:fixed;top:158px;bottom:24px;width:min(300px,86vw);z-index:30;display:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #library{right:0} #sidebar{left:0}
  #app.m-lib #library{display:flex} #app.m-side #sidebar{display:flex}
  .logo span,.docname,.tb .tl{display:none}
  #stStats{display:none}
}
[dir=ltr] .vec .vl{direction:ltr;text-align:left}
[dir=ltr] .tlnm{direction:ltr;justify-content:flex-start}
@media (max-width:900px){[dir=ltr] #library{right:auto;left:0}[dir=ltr] #sidebar{left:auto;right:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="sp">
  <div class="sp-cube"><div></div></div>
  <div class="sp-title" id="spTitle"></div>
  <div class="sp-sub">2D & 3D Design Studio · Preparing libraries</div>
  <div class="sp-bar"><i id="spBar"></i></div>
</div></div>

<div id="app">
  <header id="titlebar">
    <div class="logo"><b>3D</b>EXPRESS <span>Studio</span></div>
    <div id="tbScroll">
      <button class="tb" data-cmd="new" title="New Scene"><svg class="i"><use href="#i-new"/></svg><span class="tl">New</span></button>
      <button class="tb" data-cmd="open" title="Open a project or import a model"><svg class="i"><use href="#i-open"/></svg><span class="tl">Open / Import</span></button>
      <button class="tb" data-cmd="save" title="Save project (Ctrl+S)"><svg class="i"><use href="#i-save"/></svg><span class="tl">Save</span></button>
      <button class="tb" data-cmd="export" title="Export"><svg class="i"><use href="#i-export"/></svg><span class="tl">Export ▾</span></button>
      <div class="tsep"></div>
      <button class="tb" data-cmd="undo" title="Undo (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="tb" data-cmd="redo" title="Redo (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg></button>
      <div class="tsep"></div>
      <button class="tb" data-cmd="demo" title="Load the demo scene"><svg class="i"><use href="#i-models"/></svg><span class="tl">Demo Scene</span></button>

/* ───────────── Thumbnails (rendered live with three.js) ───────────── */
function makeThumbs() {
  const tr = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); tr.setPixelRatio(1); tr.setSize(112, 112);
  tr.toneMapping = THREE.ACESFilmicToneMapping; tr.outputColorSpace = THREE.SRGBColorSpace;
  const ts = new THREE.Scene(); const pm = new THREE.PMREMGenerator(tr); ts.environment = pm.fromScene(new RoomEnvironment(tr), .04).texture;
  ts.add(new THREE.HemisphereLight(0xffffff, 0x445566, .9)); const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(3, 5, 4); ts.add(dl);
  const cam = new THREE.PerspectiveCamera(32, 1, .01, 100);
  const shot = obj => {
    ts.add(obj); obj.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(obj); const c = b.getCenter(new V3()); const r = b.getSize(new V3()).length() * .5;
    cam.position.copy(c).add(new V3(1, .7, 1.3).normalize().multiplyScalar(r / Math.sin(16 * D2R) * .92)); cam.lookAt(c);
    tr.clear(); tr.render(ts, cam); const url = tr.domElement.toDataURL('image/png'); ts.remove(obj); disposeObj(obj); return url;
  };
  for (const k in PRIMS) THUMB['prim:' + k] = shot(build({ kind: 'prim', type: k }, { ...defMat('#9fb6d0'), f: !!PRIMS[k].flat }));
  for (const k in MODELS) THUMB['model:' + k] = shot(build({ kind: 'model', type: k }, null));
  for (const k in RIGS) { const o = build({ kind: 'rig', type: k }, null); o.traverse(c => { if (c.userData.joint) c.visible = false; }); THUMB['rig:' + k] = shot(o); }
  for (const m of MATS) THUMB['mat:' + m.id] = shot(build({ kind: 'prim', type: 'sphere' }, { ...defMat(), ...m.m }));
  for (const t of TEXLIST) { const c = document.createElement('canvas'); c.width = c.height = 96; c.getContext('2d').drawImage(getCanvas(t.id), 0, 0, 96, 96); THUMB['tex:' + t.id] = c.toDataURL(); }
  pm.dispose(); tr.dispose(); tr.forceContextLoss();
  palI = 0;
}

}
boot().catch(err => { console.error(err); const s = $('#splash'); if (s) s.querySelector('.sp-sub').textContent = T('تعذّر التشغيل: ') + err.message; });
